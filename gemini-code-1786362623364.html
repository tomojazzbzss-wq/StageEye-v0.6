<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SPACE TERRA - Auto MV Camera</title>
    <!-- face-api.js -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; background: #000; color: #fff;
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        .container { 
            position: relative; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh;
            background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        canvas { width: 100%; height: 100%; object-fit: contain; }
        video { display: none; }
        
        /* ミニマルUI */
        .hud { 
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10; pointer-events: none;
        }
        .badge { 
            background: rgba(255, 0, 0, 0.85); color: #fff; padding: 6px 12px; 
            font-size: 12px; font-weight: bold; border-radius: 20px; letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255,0,0,0.5);
        }
        .controls {
            position: absolute; bottom: 15px; right: 15px; z-index: 20;
            display: flex; gap: 10px;
        }
        select, button {
            background: rgba(0,0,0,0.6); color: #fff; border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 12px; border-radius: 8px; font-size: 12px; backdrop-filter: blur(10px);
            outline: none; cursor: pointer;
        }
        button:active { background: rgba(255,255,255,0.3); }
        #status { position: absolute; bottom: 15px; left: 15px; font-size: 11px; color: #888; z-index: 10; }
    </style>
</head>
<body>

<div class="container">
    <div class="hud">
        <div class="badge">● AUTO MV MODE</div>
    </div>
    <canvas id="previewCanvas"></canvas>
    
    <div class="controls">
        <!-- iPhone 15 Proのカメラ選択ドロップダウン -->
        <select id="cameraSelect"></select>
        <!-- 手動SNS動画作成ボタン -->
        <button id="recBtn">🎬 15s SNS動画生成</button>
    </div>
    <div id="status">AIモデル読み込み中...</div>
</div>

<video id="webcam" autoplay playsinline muted></video>

<script>
const video = document.getElementById('webcam');
const canvas = document.getElementById('previewCanvas');
const ctx = canvas.getContext('2d');
const statusText = document.getElementById('status');
const cameraSelect = document.getElementById('cameraSelect');
const recBtn = document.getElementById('recBtn');

// 🎵 設定
const BPM = 110; 
const beatInterval = (60 / BPM) * 1000; 
const beatsPerCut = 4; // 4拍（1小節）ごとにカメラ切り替え

// 状態変数
let isModelLoaded = false;
let detectedFaces = [];
let currentStream = null;

// ケン・バーンズ（滑らかな補間）用の管理変数
let startView = { x: 0, y: 0, w: 1, h: 1 };
let targetView = { x: 0, y: 0, w: 1, h: 1 };
let currentView = { x: 0, y: 0, w: 1, h: 1 };

let transitionProgress = 1.0; // 0.0(開始) 〜 1.0(完了)
let transitionDuration = beatInterval * beatsPerCut; // 切り替えにかける時間(ms)
let transitionStartTime = 0;

let flashIntensity = 0.0;
let beatCount = 0;

// iOS用 隠しCanvas
const shadowCanvas = document.createElement('canvas');
const shadowCtx = shadowCanvas.getContext('2d');

// 1. アプリ初期化
async function initApp() {
    try {
        // AIモデル読み込み
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/weights';
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        isModelLoaded = true;
        
        // スリープ防止
        if ('wakeLock' in navigator) { await navigator.wakeLock.request('screen'); }

        // カメラリストの取得 & 初期カメラ起動
        await setupCameraList();
        
        statusText.innerText = "稼働中: 全自動撮影モード";
        startBPMSyncClock();
        detectFacesLoop();
        drawLoop(performance.now());

    } catch (err) {
        statusText.innerText = "エラー: " + err.message;
        console.error(err);
    }
}

// 📱 iPhone 15 Proの複数カメラ（広角・超広角・望遠）を列挙して選択できるようにする
async function setupCameraList() {
    // カメラパーミッション取得のためのダミー起動
    const tempStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    tempStream.getTracks().forEach(track => track.stop());

    const devices = await navigator.mediaDevices.enumerateDevices();
    const videoDevices = devices.filter(d => d.kind === 'videoinput');

    cameraSelect.innerHTML = '';
    videoDevices.forEach((device, index) => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        // カメラ名の表示（iOSのカメラ名を整形）
        option.text = device.label || `カメラ ${index + 1}`;
        cameraSelect.appendChild(option);
    });

    // バックカメラ（Ultra Wide / Wide / Telephoto）を優先選択
    const backCamera = videoDevices.find(d => d.label.includes('Back') || d.label.includes('背面') || d.label.includes('0')) || videoDevices[0];
    if (backCamera) {
        cameraSelect.value = backCamera.deviceId;
    }

    await startCamera(cameraSelect.value);

    // カメラ変更イベント
    cameraSelect.addEventListener('change', async () => {
        await startCamera(cameraSelect.value);
    });
}

// カメラストリームの開始
async function startCamera(deviceId) {
    if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
    }

    const constraints = {
        video: {
            deviceId: deviceId ? { exact: deviceId } : undefined,
            width: { ideal: 1920 },
            height: { ideal: 1080 }
        },
        audio: false
    };

    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = currentStream;

    return new Promise((resolve) => {
        video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            shadowCanvas.width = video.videoWidth;
            shadowCanvas.height = video.videoHeight;
            resolve();
        };
    });
}

// 2. 🧠 AI 顔検知ループ
async function detectFacesLoop() {
    if (!isModelLoaded || video.paused || video.ended) {
        setTimeout(detectFacesLoop, 100);
        return;
    }

    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        shadowCtx.drawImage(video, 0, 0, shadowCanvas.width, shadowCanvas.height);
        const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 128, scoreThreshold: 0.4 });
        const detections = await faceapi.detectAllFaces(shadowCanvas, options);

        detectedFaces = detections.map(det => ({
            x: det.box.x / shadowCanvas.width,
            y: det.box.y / shadowCanvas.height,
            w: det.box.width / shadowCanvas.width,
            h: det.box.height / shadowCanvas.height
        }));
    }
    setTimeout(detectFacesLoop, 40); // 約25fpsでAI検知
}

// 3. 🎬 ケン・バーンズ補間（滑らかな加減速イージング関数）
function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

// BPMクロック
function startBPMSyncClock() {
    setInterval(() => {
        beatCount++;
        if (beatCount % beatsPerCut === 0) {
            switchCameraTarget();
        }
    }, beatInterval);
}

// 画角・ズームの切り替え処理（継ぎ目を滑らかにするスムーズ移行処理）
function switchCameraTarget() {
    // 現在の最新座標を移動開始点(startView)としてセット
    startView = { ...currentView };

    if (detectedFaces.length > 0) {
        const mode = Math.random();
        if (mode < 0.75) {
            // 顔へズーム
            const face = detectedFaces[Math.floor(Math.random() * detectedFaces.length)];
            const centerX = face.x + (face.w / 2);
            const centerY = face.y + (face.h / 2);
            const zoomLevel = Math.max(0.25, face.w * 2.8);
            setTargetWithAspectRatio(centerX, centerY, zoomLevel);
        } else {
            // 全体を引きで映す
            setTargetWithAspectRatio(0.5, 0.5, 1.0);
        }
    } else {
        // 無人時のアンビエントズーム（店内の風景を優雅にパン）
        const ambientZoom = 0.6 + Math.random() * 0.3;
        const randomX = 0.2 + Math.random() * 0.6;
        const randomY = 0.2 + Math.random() * 0.6;
        setTargetWithAspectRatio(randomX, randomY, ambientZoom);
    }

    // 移行アニメーションのタイマー初期化
    transitionStartTime = performance.now();
    transitionProgress = 0.0;
    flashIntensity = 0.2; // ビートフラッシュ
}

// 縦横比維持のターゲット領域計算
function setTargetWithAspectRatio(centerX, centerY, zoomFactor) {
    const aspect = video.videoWidth / video.videoHeight;
    let targetW = zoomFactor;
    let targetH = targetW / aspect;
    let targetX = centerX - (targetW / 2);
    let targetY = centerY - (targetH / 2);

    targetX = Math.max(0, Math.min(1 - targetW, targetX));
    targetY = Math.max(0, Math.min(1 - targetH, targetY));

    targetView = { x: targetX, y: targetY, w: targetW, h: targetH };
}

// 4. 🎨 描画ループ（アニメーション）
function drawLoop(now) {
    // ケン・バーンズ補間イージング処理（継ぎ目の不自然さを完全解消）
    if (transitionProgress < 1.0) {
        const elapsedTime = now - transitionStartTime;
        transitionProgress = Math.min(1.0, elapsedTime / transitionDuration);
        
        // イージング関数を適用して進行度(t)をなめらかに補正
        const easeT = easeInOutCubic(transitionProgress);

        // 各座標を始点から終点へイージング補間
        currentView.x = startView.x + (targetView.x - startView.x) * easeT;
        currentView.y = startView.y + (targetView.y - startView.y) * easeT;
        currentView.w = startView.w + (targetView.w - startView.w) * easeT;
        currentView.h = startView.h + (targetView.h - startView.h) * easeT;
    }

    const sx = currentView.x * video.videoWidth;
    const sy = currentView.y * video.videoHeight;
    const sw = currentView.w * video.videoWidth;
    const sh = currentView.h * video.videoHeight;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        ctx.drawImage(shadowCanvas, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    }

    // シネマ風カラーオーバーレイ
    ctx.fillStyle = "rgba(0, 15, 50, 0.04)"; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // フラッシュ
    if (flashIntensity > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${flashIntensity})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        flashIntensity -= 0.015;
    }

    requestAnimationFrame(drawLoop);
}

// 📹 15秒SNS動画録画処理
let mediaRecorder;
let recordedChunks = [];
recBtn.addEventListener('click', () => {
    if (recordedChunks.length > 0 && mediaRecorder && mediaRecorder.state === 'recording') return;

    recordedChunks = [];
    const stream = canvas.captureStream(30);
    try {
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/mp4' });
    } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
    }

    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/mp4' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `TERRA_MV_${Date.now()}.mp4`;
        a.click();
        recBtn.innerText = "🎬 15s SNS動画生成";
        recBtn.style.background = "rgba(0,0,0,0.6)";
    };

    mediaRecorder.start();
    recBtn.innerText = "🔴 15秒録画中...";
    recBtn.style.background = "rgba(255,0,0,0.8)";
    setTimeout(() => { if (mediaRecorder.state !== 'inactive') mediaRecorder.stop(); }, 15000);
});

// 起動
initApp();
</script>
</body>
</html>
